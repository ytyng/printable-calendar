# Nuxt のサイトをビルドして GitHub Pages へデプロイする。
#
# ビルドの前に必ずユニットテストを通す。
# 方針: https://github.com/cyberneura/cyberneura-github-actions/blob/main/docs/build-requires-tests.md
name: Deploy Nuxt site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # テストは PR でも走らせる (デプロイは main でのみ行う)
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# 既定は読み取りのみ。Pages への書き込みは deploy job だけが持つ。
permissions:
  contents: read

jobs:
  # Test job (build の門番)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  # Build job
  build:
    needs: test
    # PR ではビルド成果物を作らない (テストだけ走らせる)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pick your own package manager and build script
      - run: npm ci
      - run: npx nuxt build --preset github_pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  # Deployment job
  deploy:
    # Add a dependency to the build job
    needs: build
    # Allow only one concurrent deployment, skipping runs queued between the run
    # in-progress and latest queued. However, do NOT cancel in-progress runs as we
    # want to allow these production deployments to complete.
    # PR のテストまで直列化しないよう、workflow 全体ではなくこの job に付ける。
    concurrency:
      group: "pages"
      cancel-in-progress: false
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    # Deploy to the github_pages environment
    environment:
      name: github_pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
